# Single-VPS production stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
# See docs/RUNBOOK.md for first-time setup, migrations, admins and backups.
name: predict

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-predict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-predict}
    volumes: [postgres:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-predict}']
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis:/data]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: predict-api
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-predict}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-predict}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build:
      context: ..
      dockerfile: deploy/next.Dockerfile
      args:
        APP: web
        NEXT_PUBLIC_SITE_URL: https://${WEB_HOST:-predict.scoutgram.africa}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: predict-web
    restart: unless-stopped
    environment:
      PORT: 3000
      API_ORIGIN: http://api:4000
    depends_on: [api]

  admin:
    build:
      context: ..
      dockerfile: deploy/next.Dockerfile
      args: { APP: admin }
    image: predict-admin
    restart: unless-stopped
    environment:
      PORT: 3001
      API_ORIGIN: http://api:4000
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Lets Encrypt}
      WEB_HOST: ${WEB_HOST:-predict.scoutgram.africa}
      ADMIN_HOST: ${ADMIN_HOST:-predict-admin.scoutgram.africa}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    depends_on: [web, admin]

volumes:
  postgres:
  redis:
  caddy-data:
  caddy-config:
