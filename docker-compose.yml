# Local infrastructure for development. Host ports avoid the usual 5432/6379 in case a native
# Postgres or Redis is already running; override them with PREDICT_PG_PORT / PREDICT_REDIS_PORT.
name: predict

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: predict
      POSTGRES_PASSWORD: predict
      POSTGRES_DB: predict
    ports: ['${PREDICT_PG_PORT:-55432}:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U predict']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['${PREDICT_REDIS_PORT:-56379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  postgres:
